<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 100" role="img" aria-label="Auditavisión: una moneda de oro inspectora, con lupa, bigote, sombrero y alas de ángel">
  <title>Auditavisión</title>
  <defs>
    <radialGradient id="oro" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.35" stop-color="#f7cf45"/>
      <stop offset="0.75" stop-color="#d9a21a"/>
      <stop offset="1" stop-color="#a8740c"/>
    </radialGradient>
    <linearGradient id="canto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="0.5" stop-color="#c8900f"/>
      <stop offset="1" stop-color="#7a5206"/>
    </linearGradient>
    <linearGradient id="pluma" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eef7"/>
    </linearGradient>
    <linearGradient id="sello" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d23a2e"/>
      <stop offset="1" stop-color="#8e1a14"/>
    </linearGradient>
    <!-- Una pluma larga: nace en el hombro (0,0) y apunta a la izquierda -->
    <path id="primaria" d="M0 0 C -9 -4.6, -26 -5.2, -37 -0.6 C -35 1.6, -33 2.4, -30 2.6 C -20 4.4, -8 3.6, 0 0 Z" fill="url(#pluma)" stroke="#8a95a8" stroke-width="1.1" stroke-linejoin="round"/>
    <path id="cubierta" d="M0 0 C -6 -3.6, -15 -3.8, -20 -0.4 C -15 3.4, -6 3.2, 0 0 Z" fill="#ffffff" stroke="#8a95a8" stroke-width="1" stroke-linejoin="round"/>
    <g id="ala">
      <!-- plumas primarias, en abanico del alto al bajo -->
      <g transform="translate(38 51)">
        <use xlink:href="#primaria" href="#primaria" transform="rotate(58) scale(0.86)"/>
        <use xlink:href="#primaria" href="#primaria" transform="rotate(44) scale(1.02)"/>
        <use xlink:href="#primaria" href="#primaria" transform="rotate(30) scale(1.08)"/>
        <use xlink:href="#primaria" href="#primaria" transform="rotate(16) scale(1.06)"/>
        <use xlink:href="#primaria" href="#primaria" transform="rotate(2) scale(0.98)"/>
        <use xlink:href="#primaria" href="#primaria" transform="rotate(-12) scale(0.86)"/>
        <use xlink:href="#primaria" href="#primaria" transform="rotate(-26) scale(0.72)"/>
        <!-- plumas cubiertas: la segunda hilera, más corta -->
        <use xlink:href="#cubierta" href="#cubierta" transform="rotate(52) scale(0.95)"/>
        <use xlink:href="#cubierta" href="#cubierta" transform="rotate(36) scale(1)"/>
        <use xlink:href="#cubierta" href="#cubierta" transform="rotate(20) scale(1)"/>
        <use xlink:href="#cubierta" href="#cubierta" transform="rotate(4) scale(0.92)"/>
        <use xlink:href="#cubierta" href="#cubierta" transform="rotate(-12) scale(0.8)"/>
        <!-- el arco del ala, con su plumón -->
        <path d="M2 -4 C -6 -18, -16 -26, -24 -28 C -20 -20, -14 -12, -4 -2 Z" fill="#ffffff" stroke="#8a95a8" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M0 -6 C -4 -10, -9 -12, -12 -11 C -11 -8, -8 -6, -4 -4 M-2 -1 C -6 -4, -10 -5, -12 -3 C -9 -1, -6 0, -2 1" fill="#ffffff" stroke="#8a95a8" stroke-width="0.9" stroke-linejoin="round"/>
      </g>
    </g>
  </defs>

  <!-- alas de ángel, detrás de la moneda -->
  <use xlink:href="#ala" href="#ala"/>
  <use xlink:href="#ala" href="#ala" transform="translate(128 0) scale(-1 1)"/>

  <!-- la moneda: canto acuñado, cara y gráfila -->
  <circle cx="64" cy="58" r="34" fill="url(#canto)" stroke="#6b4705" stroke-width="1.6"/>
  <circle cx="64" cy="58" r="32" fill="none" stroke="#8a5d07" stroke-width="2.4" stroke-dasharray="1.2 1.6" opacity="0.7"/>
  <circle cx="64" cy="58" r="29.5" fill="url(#oro)" stroke="#9c6b0a" stroke-width="1.2"/>
  <circle cx="64" cy="58" r="26.5" fill="none" stroke="#b9860f" stroke-width="1" stroke-dasharray="0.1 2.6" stroke-linecap="round"/>
  <circle cx="64" cy="58" r="26.5" fill="none" stroke="#fff1a8" stroke-width="0.5" stroke-dasharray="0.1 2.6" stroke-linecap="round" transform="translate(-0.4 -0.4)"/>
  <!-- brillo -->
  <path d="M42 44 A 26 26 0 0 1 60 32.5" fill="none" stroke="#fffbe0" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>

  <!-- el rostro -->
  <path d="M44.5 49 Q50 45.4 55.5 48" fill="none" stroke="#5a3a02" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="50.5" cy="55" rx="5" ry="5.6" fill="#ffffff" stroke="#5a3a02" stroke-width="1.5"/>
  <circle cx="51.8" cy="55.8" r="2.7" fill="#10202e"/>
  <circle cx="52.8" cy="54.6" r="0.9" fill="#ffffff"/>
  <!-- bigote estilo Zapata: lleno, con las puntas caídas a los lados de la boca -->
  <path d="M64 64.4C68.32 61.88 74.08 62.24 76.96 65.3C79.3 68 79.66 73.22 78.76 78.08C78.22 80.6 74.8 80.78 74.44 78.08C74.08 74.48 72.1 71.6 69.04 70.7C66.88 70.16 65.08 70.7 64 71.6C62.92 70.7 61.12 70.16 58.96 70.7C55.9 71.6 53.92 74.48 53.56 78.08C53.2 80.78 49.78 80.6 49.24 78.08C48.34 73.22 48.7 68 51.04 65.3C53.92 62.24 59.68 61.88 64 64.4Z" fill="#3b2708" stroke="#1f1404" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M66.52 65.48 Q72.28 64.76 75.88 70.16M67.96 67.64 Q74.08 68 76.42 76.28M71.2 65.12 Q76.6 67.28 77.32 74.48M61.48 65.48 Q55.72 64.76 52.12 70.16M60.04 67.64 Q53.92 68 51.58 76.28M56.8 65.12 Q51.4 67.28 50.68 74.48" fill="none" stroke="#6b4a1c" stroke-width="0.7" stroke-linecap="round" opacity="0.85"/>
  <!-- sonrisa, asomando bajo el bigote -->
  <path d="M59.4 74.8 Q64 77.8 68.6 74.8" fill="none" stroke="#5a3a02" stroke-width="1.8" stroke-linecap="round"/>

  <!-- la lupa sobre el ojo derecho -->
  <line x1="82.6" y1="63" x2="95.5" y2="77" stroke="#4a2f08" stroke-width="6.4" stroke-linecap="round"/>
  <line x1="82.6" y1="63" x2="95.5" y2="77" stroke="#9a6a22" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="75" cy="54.5" r="11" fill="#d6ecff" fill-opacity="0.6" stroke="#2b3444" stroke-width="3.2"/>
  <circle cx="75" cy="54.5" r="11" fill="none" stroke="#8a95a8" stroke-width="1" />
  <path d="M68.4 46.4 Q74 42.2 79.6 45.2" fill="none" stroke="#5a3a02" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="75" cy="55" rx="7" ry="7.6" fill="#ffffff" stroke="#5a3a02" stroke-width="1.4"/>
  <circle cx="76.2" cy="56" r="3.9" fill="#10202e"/>
  <circle cx="77.6" cy="54.4" r="1.3" fill="#ffffff"/>
  <path d="M68.6 49.5 A 8 8 0 0 1 72.8 46.4" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>

  <!-- el sello: roseta de lacre con la palomita de verificado -->
  <g transform="translate(40.5 78.5)">
    <path d="M-3 4 L-5.5 12 L-2.4 10.4 L-0.6 13.2 L0.4 5 Z M3 4 L5.5 12 L2.4 10.4 L0.6 13.2 L-0.4 5 Z" fill="#8e1a14"/>
    <path d="M0 -8.2 L2.2 -6 L5.4 -6.6 L5.8 -3.4 L8.4 -1.6 L6.8 1.2 L7.6 4.4 L4.4 5 L3 8 L0 6.6 L-3 8 L-4.4 5 L-7.6 4.4 L-6.8 1.2 L-8.4 -1.6 L-5.8 -3.4 L-5.4 -6.6 L-2.2 -6 Z" fill="url(#sello)" stroke="#5c0f0a" stroke-width="0.8" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="4.6" fill="none" stroke="#f3c1b8" stroke-width="0.6" opacity="0.8"/>
    <path d="M-2.6 0.2 L-0.7 2.2 L2.8 -2" fill="none" stroke="#fff4d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- el sombrero -->
  <g transform="rotate(-9 60 26)">
    <ellipse cx="60" cy="29" rx="21" ry="4.4" fill="#1b2433" stroke="#d4a826" stroke-width="1.2"/>
    <path d="M46 29 C 46 15, 50 11, 60 11 C 70 11, 74 15, 74 29 Z" fill="#1b2433" stroke="#d4a826" stroke-width="1.2"/>
    <path d="M52 13.6 Q60 17 68 13.6" fill="none" stroke="#2f3b50" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="46.3" y="22.6" width="27.4" height="4.8" fill="#d4a826"/>
    <rect x="46.3" y="22.6" width="27.4" height="1.2" fill="#fff0b0" opacity="0.7"/>
  </g>
</svg>
