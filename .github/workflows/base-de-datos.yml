# Sube la base de datos y la función de los códigos al proyecto de Supabase
# del autor (nuqiyzcilbrrlezmesnf, creado el 29-10-2026). Las llaves viven
# solo en los secretos del repositorio (Settings → Secrets and variables →
# Actions), nunca en el chat ni en el código:
#   SUPABASE_ACCESS_TOKEN  token personal de supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   la contraseña de la base que se eligió al crear el proyecto
#   SAL_IP                 (opcional) una frase al azar para cifrar la huella de la IP
# Sin los secretos, el flujo avisa y no hace nada.
name: Sube la base de datos

on:
  push:
    branches: [claude/funny-turing-imtm54, main]
    paths: ['supabase/**', '.github/workflows/base-de-datos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-de-datos
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROYECTO: nuqiyzcilbrrlezmesnf
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SAL_IP: ${{ secrets.SAL_IP }}
      INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
    steps:
      - name: ¿Están los secretos?
        id: hay
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Faltan SUPABASE_ACCESS_TOKEN o SUPABASE_DB_PASSWORD en los secretos del repositorio: no se sube nada."
            echo "si=no" >> "$GITHUB_OUTPUT"
          else
            echo "si=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.hay.outputs.si == 'si'
      - uses: supabase/setup-cli@v1
        if: steps.hay.outputs.si == 'si'
        with:
          version: latest
      - name: Liga el proyecto
        if: steps.hay.outputs.si == 'si'
        run: supabase link --project-ref "$PROYECTO" --password "$SUPABASE_DB_PASSWORD"
      - name: Sube las migraciones
        if: steps.hay.outputs.si == 'si'
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --yes
      - name: Sube la sal de la huella
        if: steps.hay.outputs.si == 'si' && env.SAL_IP != ''
        run: supabase secrets set --project-ref "$PROYECTO" SAL_IP="$SAL_IP" --yes
      - name: Sube la función de los códigos
        if: steps.hay.outputs.si == 'si'
        run: supabase functions deploy codigo --project-ref "$PROYECTO" --no-verify-jwt --yes
      # Las fuentes en vivo (30-10-2026): las llaves gratuitas de Banxico e
      # INEGI van en los secretos del repositorio y de ahí a los de Supabase;
      # nunca en un archivo ni en el chat. Sin ninguna, la función no se sube.
      # Formularios y «Lo que aún no sé» (30-10-2026): con el aviso de
      # privacidad ya diciendo cuánto se guarda (12 meses).
      - name: Sube las funciones de los formularios
        if: steps.hay.outputs.si == 'si'
        run: |
          supabase functions deploy recibir-formulario --project-ref "$PROYECTO" --no-verify-jwt --yes
          supabase functions deploy pregunta-bot --project-ref "$PROYECTO" --no-verify-jwt --yes
      # La IA del Auditor (02-11-2026): la llave ANTHROPIC_API_KEY vive solo en
      # los secretos de Supabase (la puso el autor); aquí solo se suben las
      # funciones. Sin la llave, contestan «pendiente» y el chat sigue igual.
      - name: Sube las funciones de la IA
        if: steps.hay.outputs.si == 'si'
        run: |
          supabase functions deploy auditor-ia --project-ref "$PROYECTO" --no-verify-jwt --yes
          supabase functions deploy buscar-web --project-ref "$PROYECTO" --no-verify-jwt --yes
      - name: Prueba la IA con una pregunta real
        if: steps.hay.outputs.si == 'si'
        run: |
          sleep 5
          cuerpo=$(python3 - <<'PY'
          import json, re
          s = open('assets/auditor/js/asistente-base.js', encoding='utf-8').read()
          i = s.index('window.AUDITOR_BASE = ') + len('window.AUDITOR_BASE = ')
          f = json.loads(s[i:s.rindex('};') + 1])['fichas']
          ids = [k for k, x in enumerate(f) if 'Ramo 33' in x.get('tit', '')][:4]
          v = re.search(r'\?v=(\d{8}[a-z]{0,2})', open('index.html', encoding='utf-8').read()).group(1)
          print(json.dumps({'pregunta': '¿Para qué sirve el Ramo 33?', 'fichas': ids, 'version': v}))
          PY
          )
          r=$(curl -s -m 90 -X POST "https://$PROYECTO.supabase.co/functions/v1/auditor-ia" \
            -H 'Content-Type: application/json' -H 'Origin: https://auditavision.com.mx' -d "$cuerpo")
          echo "$r" | head -c 900; echo
          if echo "$r" | grep -q '"pendiente":true'; then echo "::warning::La IA no tiene su llave en Supabase (ANTHROPIC_API_KEY)"; exit 0; fi
          echo "$r" | grep -q '"ok":true' || { echo "::error::La IA no contestó la pregunta de prueba"; exit 1; }
      # Banxico salió el 01-11-2026 por decisión del autor: ya no se usa su llave
      # y este flujo no la vuelve a poner en Supabase.
      - name: Sube la llave del INEGI
        if: steps.hay.outputs.si == 'si' && env.INEGI_TOKEN != ''
        run: supabase secrets set --project-ref "$PROYECTO" INEGI_TOKEN="$INEGI_TOKEN" --yes
      - name: Sube la función de los portales
        if: steps.hay.outputs.si == 'si' && env.INEGI_TOKEN != ''
        run: supabase functions deploy portales --project-ref "$PROYECTO" --no-verify-jwt --yes
      - name: Prueba la consulta al INEGI
        if: steps.hay.outputs.si == 'si' && env.INEGI_TOKEN != ''
        run: |
          sleep 2
          r=$(curl -s -m 40 -X POST "https://$PROYECTO.supabase.co/functions/v1/portales" \
            -H 'Content-Type: application/json' -H 'Origin: https://auditavision.com.mx' \
            -d '{"fuente":"inegi-bie","clave":"1002000001"}')
          echo "$r" | head -c 600; echo
          echo "$r" | grep -q '"ok":true' || { echo "::error::La función portales no trajo el indicador del INEGI"; exit 1; }
