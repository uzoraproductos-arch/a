# Listas del padrón de contrapartes (18-11-2026, pedido del autor: «compliance
# de prevención de lavado de dinero»). Cada semana vuelve a bajar de su fuente
# oficial las listas del SAT (art. 69, 17-H Bis y 69-B Bis), la lista SDN de la
# OFAC y la lista consolidada de la ONU (herramientas/anclar_listas.py), con su
# huella SHA-256. Si una lista cambió sus columnas o sus cuentas no cuadran, el
# script se detiene y la corrida sale en rojo: no se publica nada. Si nada
# cambió, no toca el repositorio.
#
# La lista 69-B no la toca este flujo: la sigue el Vigía 69-B, que solo propone
# (AGENTS.md §5 ter).
name: Listas del padrón

on:
  workflow_dispatch:
  schedule:
    - cron: '11 16 * * 3'   # miércoles, 16:11 UTC = 10:11 en la Ciudad de México, tras el Vigía 69-B

permissions:
  contents: write

concurrency:
  group: listas
  cancel-in-progress: false

jobs:
  listas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-turing-imtm54
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bajar y cuadrar las listas
        run: python herramientas/anclar_listas.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publicar si alguna lista cambió
        run: |
          # Solo cuentan los datos: la ONU fecha su archivo cada día aunque no cambie nada.
          if [ -z "$(git status --porcelain -- 'assets/auditor/data/padron/s-*.js' assets/auditor/data/sanciones-int.js)" ]; then
            echo "Sin cambios: las listas ya están al día." | tee -a "$GITHUB_STEP_SUMMARY"
            git checkout -- docs/listas/listas.json assets/auditor/data/padron/meta.js
            exit 0
          fi
          python herramientas/sello.py --siguiente
          node --check assets/auditor/js/padron.js
          python herramientas/inventario.py
          git config user.name "Listas del padrón"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Listas del padrón: vueltas a bajar de su fuente oficial el $(date +%d-%m-%Y)"
          git pull --rebase origin claude/funny-turing-imtm54
          git push origin HEAD:claude/funny-turing-imtm54
