# Sube la base de datos y la función de los códigos al proyecto de Supabase
# del autor (nuqiyzcilbrrlezmesnf, creado el 29-10-2026). Las llaves viven
# solo en los secretos del repositorio (Settings → Secrets and variables →
# Actions), nunca en el chat ni en el código:
#   SUPABASE_ACCESS_TOKEN  token personal de supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   la contraseña de la base que se eligió al crear el proyecto
#   SAL_IP                 (opcional) una frase al azar para cifrar la huella de la IP
# Sin los secretos, el flujo avisa y no hace nada.
name: Sube la base de datos

on:
  push:
    branches: [claude/funny-turing-imtm54, main]
    paths: ['supabase/**', '.github/workflows/base-de-datos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-de-datos
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROYECTO: nuqiyzcilbrrlezmesnf
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SAL_IP: ${{ secrets.SAL_IP }}
      BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
      INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
    steps:
      - name: ¿Están los secretos?
        id: hay
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Faltan SUPABASE_ACCESS_TOKEN o SUPABASE_DB_PASSWORD en los secretos del repositorio: no se sube nada."
            echo "si=no" >> "$GITHUB_OUTPUT"
          else
            echo "si=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.hay.outputs.si == 'si'
      - uses: supabase/setup-cli@v1
        if: steps.hay.outputs.si == 'si'
        with:
          version: latest
      - name: Liga el proyecto
        if: steps.hay.outputs.si == 'si'
        run: supabase link --project-ref "$PROYECTO" --password "$SUPABASE_DB_PASSWORD"
      - name: Sube las migraciones
        if: steps.hay.outputs.si == 'si'
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all
      - name: Sube la sal de la huella
        if: steps.hay.outputs.si == 'si' && env.SAL_IP != ''
        run: supabase secrets set --project-ref "$PROYECTO" SAL_IP="$SAL_IP"
      - name: Sube la función de los códigos
        if: steps.hay.outputs.si == 'si'
        run: supabase functions deploy codigo --project-ref "$PROYECTO" --no-verify-jwt
      # Las fuentes en vivo (30-10-2026): las llaves gratuitas de Banxico e
      # INEGI van en los secretos del repositorio y de ahí a los de Supabase;
      # nunca en un archivo ni en el chat. Sin ninguna, la función no se sube.
      - name: Sube las llaves de Banxico e INEGI
        if: steps.hay.outputs.si == 'si' && (env.BANXICO_TOKEN != '' || env.INEGI_TOKEN != '')
        run: |
          [ -n "$BANXICO_TOKEN" ] && supabase secrets set --project-ref "$PROYECTO" BANXICO_TOKEN="$BANXICO_TOKEN"
          [ -n "$INEGI_TOKEN" ] && supabase secrets set --project-ref "$PROYECTO" INEGI_TOKEN="$INEGI_TOKEN"
          true
      - name: Sube la función de los portales
        if: steps.hay.outputs.si == 'si' && (env.BANXICO_TOKEN != '' || env.INEGI_TOKEN != '')
        run: supabase functions deploy portales --project-ref "$PROYECTO" --no-verify-jwt
      - name: Prueba la consulta a Banxico
        if: steps.hay.outputs.si == 'si' && env.BANXICO_TOKEN != ''
        run: |
          sleep 5
          r=$(curl -s -m 40 -X POST "https://$PROYECTO.supabase.co/functions/v1/portales" \
            -H 'Content-Type: application/json' -H 'Origin: https://auditavision.com.mx' \
            -d '{"fuente":"banxico-sie","clave":"SF43718"}')
          echo "$r" | head -c 600; echo
          echo "$r" | grep -q '"ok":true' || { echo "::error::La función portales no trajo el tipo de cambio de Banxico"; exit 1; }
      - name: Prueba la consulta al INEGI
        if: steps.hay.outputs.si == 'si' && env.INEGI_TOKEN != ''
        run: |
          sleep 2
          r=$(curl -s -m 40 -X POST "https://$PROYECTO.supabase.co/functions/v1/portales" \
            -H 'Content-Type: application/json' -H 'Origin: https://auditavision.com.mx' \
            -d '{"fuente":"inegi-bie","clave":"1002000001"}')
          echo "$r" | head -c 600; echo
          echo "$r" | grep -q '"ok":true' || { echo "::error::La función portales no trajo el indicador del INEGI"; exit 1; }
