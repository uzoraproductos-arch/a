<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" preserveAspectRatio="xMidYMid slice">
  <!-- Ilustración de Inversión y Megaobras (Auditavisión, 27-10-2026).
       Dibujo propio, sin fotografía: una refinería, un tren sobre su
       viaducto, la torre de control de un aeropuerto y una grúa de obra,
       al atardecer. Ilustrativa: no retrata una obra en particular.
       Versión del encabezado: se desvanece por la izquierda para fundirse
       con el color de la herramienta. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071d47"/>
      <stop offset="0.38" stop-color="#1d3f7a"/>
      <stop offset="0.66" stop-color="#b8602a"/>
      <stop offset="0.82" stop-color="#f0a24a"/>
      <stop offset="1" stop-color="#f6c779"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.55" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flama" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.5" stop-color="#f59a2e"/>
      <stop offset="1" stop-color="#d4501a" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a63"/>
      <stop offset="1" stop-color="#050f28"/>
    </linearGradient>
    <linearGradient id="funde" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="mascara"><rect width="1200" height="670" fill="url(#funde)"/></mask>
  </defs>
  <g mask="url(#mascara)">

  <!-- Cielo y sol -->
  <rect width="1200" height="670" fill="url(#cielo)"/>
  <circle cx="760" cy="455" r="150" fill="url(#sol)"/>
  <circle cx="760" cy="455" r="58" fill="#fff1cc"/>

  <!-- Estrellas tenues arriba -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="520" cy="48" r="1.6"/><circle cx="640" cy="92" r="1.2"/><circle cx="905" cy="40" r="1.8"/>
    <circle cx="1080" cy="110" r="1.3"/><circle cx="1150" cy="56" r="1.5"/><circle cx="820" cy="140" r="1.1"/>
  </g>

  <!-- Avión que despega -->
  <g transform="translate(965 150) rotate(-14)" fill="#071d47">
    <path d="M0 0 L70 -3 Q80 0 70 3 L0 4 Z"/>
    <path d="M34 0 L18 -26 L28 -26 L50 0 Z"/>
    <path d="M34 2 L22 22 L31 22 L50 2 Z"/>
    <path d="M4 0 L-6 -13 L1 -13 L12 0 Z"/>
  </g>

  <!-- Cerros lejanos -->
  <path d="M0 470 Q120 420 240 445 T480 430 T720 450 T960 425 T1200 440 V670 H0 Z" fill="#7a3f2a" opacity="0.55"/>
  <path d="M0 500 Q160 465 330 488 T650 480 T980 470 T1200 485 V670 H0 Z" fill="#3a2a4a" opacity="0.6"/>

  <!-- Refinería (izquierda) -->
  <g fill="#0b2148">
    <rect x="300" y="300" width="16" height="230"/>
    <rect x="296" y="296" width="24" height="8"/>
    <rect x="345" y="350" width="26" height="180" rx="4"/>
    <rect x="380" y="380" width="22" height="150" rx="4"/>
    <rect x="412" y="330" width="14" height="200"/>
    <rect x="440" y="420" width="70" height="110" rx="35" ry="14"/>
    <rect x="520" y="440" width="58" height="90" rx="29" ry="12"/>
    <rect x="290" y="470" width="300" height="12"/>
    <rect x="290" y="440" width="140" height="6"/>
  </g>
  <!-- Andamios de la refinería -->
  <g stroke="#0b2148" stroke-width="3" fill="none">
    <path d="M345 400 H402 M345 440 H402 M412 380 L426 400 M412 420 L426 440"/>
  </g>
  <!-- Quemador con su flama -->
  <path d="M308 296 Q296 262 310 236 Q312 258 322 266 Q326 248 318 228 Q340 252 326 296 Z" fill="url(#flama)"/>
  <!-- Humo -->
  <g fill="#d9a77a" opacity="0.35">
    <ellipse cx="420" cy="300" rx="22" ry="12"/>
    <ellipse cx="446" cy="280" rx="30" ry="15"/>
    <ellipse cx="482" cy="262" rx="38" ry="17"/>
  </g>

  <!-- Viaducto con el tren (al centro) -->
  <g fill="#0a1f46">
    <rect x="0" y="512" width="1200" height="14"/>
    <rect x="70" y="526" width="18" height="90"/>
    <rect x="250" y="526" width="18" height="90"/>
    <rect x="430" y="526" width="18" height="90"/>
    <rect x="610" y="526" width="18" height="90"/>
    <rect x="790" y="526" width="18" height="90"/>
    <rect x="970" y="526" width="18" height="90"/>
    <rect x="1150" y="526" width="18" height="90"/>
  </g>
  <g fill="none" stroke="#0a1f46" stroke-width="6">
    <path d="M88 526 Q169 560 250 526 M268 526 Q349 560 430 526 M448 526 Q529 560 610 526 M628 526 Q709 560 790 526 M808 526 Q889 560 970 526 M988 526 Q1069 560 1150 526"/>
  </g>
  <!-- Tren -->
  <g>
    <path d="M600 470 H1010 Q1060 470 1078 498 L1086 512 H600 Z" fill="#e9eef7"/>
    <rect x="600" y="490" width="486" height="6" fill="#c2611d"/>
    <g fill="#1d3f7a">
      <rect x="620" y="478" width="38" height="10" rx="2"/><rect x="668" y="478" width="38" height="10" rx="2"/>
      <rect x="716" y="478" width="38" height="10" rx="2"/><rect x="770" y="478" width="38" height="10" rx="2"/>
      <rect x="818" y="478" width="38" height="10" rx="2"/><rect x="866" y="478" width="38" height="10" rx="2"/>
      <rect x="920" y="478" width="38" height="10" rx="2"/><rect x="968" y="478" width="38" height="10" rx="2"/>
      <path d="M1022 478 H1048 Q1060 480 1066 490 H1022 Z"/>
    </g>
    <g stroke="#b9c3d6" stroke-width="2">
      <path d="M760 470 V512 M910 470 V512"/>
    </g>
  </g>

  <!-- Torre de control del aeropuerto (derecha) -->
  <g fill="#0b2148">
    <path d="M1040 512 L1048 300 H1072 L1080 512 Z"/>
    <path d="M1020 300 H1100 L1090 266 H1030 Z"/>
    <rect x="1036" y="248" width="48" height="18"/>
    <rect x="1056" y="222" width="8" height="26"/>
  </g>
  <rect x="1032" y="272" width="56" height="14" fill="#ffd58a" opacity="0.8"/>
  <circle cx="1060" cy="220" r="4" fill="#ff7b54"/>

  <!-- Grúa de obra -->
  <g stroke="#0b2148" fill="none" stroke-width="5">
    <path d="M880 512 V200 M904 512 V200"/>
    <path d="M880 230 L904 260 L880 290 L904 320 L880 350 L904 380 L880 410 L904 440 L880 470 L904 500"/>
    <path d="M700 200 H1000 M700 222 H1000"/>
    <path d="M720 200 L740 222 L760 200 L780 222 L800 200 L820 222 L840 200 L860 222 L880 200"/>
    <path d="M904 222 L924 200 L944 222 L964 200 L984 222"/>
    <path d="M892 200 L892 160 M892 160 L720 200 M892 160 L1000 200"/>
  </g>
  <rect x="972" y="226" width="30" height="34" fill="#0b2148"/>
  <path d="M760 222 V330" stroke="#0b2148" stroke-width="2.5"/>
  <rect x="738" y="330" width="44" height="22" fill="#c2611d"/>

  <!-- Suelo -->
  <path d="M0 600 Q300 580 600 596 T1200 590 V670 H0 Z" fill="url(#suelo)"/>
  </g>
</svg>
