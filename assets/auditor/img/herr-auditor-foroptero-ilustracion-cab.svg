<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" preserveAspectRatio="xMidYMid slice">
  <!-- Ilustración del Auditor Virtual (Auditavisión, 27-10-2026).
       Dibujo propio, sin fotografía: un foróptero, el aparato con que se
       gradúa la vista, frente a una carta de lectura con términos del
       gasto público. Ilustrativa.
       Versión del encabezado: se desvanece por la izquierda para fundirse
       con el color de la herramienta. -->
  <defs>
    <radialGradient id="fondo" cx="0.6" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#7b8592"/>
      <stop offset="1" stop-color="#2b3038"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b525d"/>
      <stop offset="1" stop-color="#1b1f25"/>
    </linearGradient>
    <linearGradient id="cromo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.5" stop-color="#a9b1bb"/>
      <stop offset="1" stop-color="#e3e7ec"/>
    </linearGradient>
    <radialGradient id="vidrio" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#cfe6ff"/>
      <stop offset="0.6" stop-color="#4f9be8"/>
      <stop offset="1" stop-color="#0b2a63"/>
    </radialGradient>
    <linearGradient id="funde" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="mascara"><rect width="1200" height="670" fill="url(#funde)"/></mask>
  </defs>
  <g mask="url(#mascara)">
  <!-- Fondo y la carta de lectura -->
  <rect width="1200" height="670" fill="url(#fondo)"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#ffffff" opacity="0.16">
